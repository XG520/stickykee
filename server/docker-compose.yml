services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stickynuo-server
    restart: unless-stopped
    # host 网络：容器直接使用宿主机网络栈，HA 看到的内网来源 IP 才不会被
    # 「仅限本地访问」拦截；同时无需端口映射（容器内 :18480 即宿主机 18480）。
    network_mode: host
    environment:
      SN_HTTP_ADDR: ":18480"
      SN_DB_PATH: "/app/data/stickynuo.db"
      SN_LOG_LEVEL: "${SN_LOG_LEVEL:-info}"
      # 注释即可用环境变量注入默认 HA 实例
      # HA_DEFAULT_URL: "${HA_DEFAULT_URL:-}"
      # HA_DEFAULT_TOKEN: "${HA_DEFAULT_TOKEN:-}"
      # 可选：扫码商品识别额度。不配置也能用（匿名约 5 次/天），
      # 在 https://apizero.cn/account/keys 免费申请后填入可提升到 20+ 次/天。
      # APIZERO_API_KEY: "${APIZERO_API_KEY:-}"
      # 可选：淘宝「码上淘」条码库，配置后国内商品覆盖更全。
      # TAOBAO_APP_KEY: "${TAOBAO_APP_KEY:-}"
      # TAOBAO_APP_SECRET: "${TAOBAO_APP_SECRET:-}"
    volumes:
      - stickynuo-data:/app/data

volumes:
  stickynuo-data: