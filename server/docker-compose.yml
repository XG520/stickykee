services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stickynuo-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SN_HTTP_ADDR: ":8080"
      SN_DB_PATH: "/app/data/stickynuo.db"
      SN_JWT_SECRET: "${SN_JWT_SECRET:-dev-secret-change-me}"
      SN_LOG_LEVEL: "${SN_LOG_LEVEL:-info}"
      # 注释即可用环境变量注入默认 HA 实例
      # HA_DEFAULT_URL: "${HA_DEFAULT_URL:-}"
      # HA_DEFAULT_TOKEN: "${HA_DEFAULT_TOKEN:-}"
    volumes:
      - stickynuo-data:/app/data

volumes:
  stickynuo-data: