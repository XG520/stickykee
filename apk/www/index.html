<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>归祺</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(165deg, #0e0f12 0%, #131418 60%, #17130e 100%);
    color: #e7e5e1; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; -webkit-tap-highlight-color: transparent;
  }
  .card { width: 100%; max-width: 400px; }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px;
    background: linear-gradient(145deg, #2a2c33, #1b1d22);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; box-shadow: 0 8px 28px rgb(0 0 0 / .45), inset 0 1px 0 rgb(255 255 255 / .06);
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; text-align: center; }
  .sub { margin: 6px 0 20px; font-size: 13px; color: #8b8a86; text-align: center; }
  label { display: block; text-align: left; font-size: 12px; color: #8b8a86; margin: 0 0 6px 2px; }
  input, select {
    width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 12px;
    border: 1px solid #2e3038; background: #17181c; color: #e7e5e1; outline: none;
  }
  input:focus, select:focus { border-color: #5a7dff; box-shadow: 0 0 0 3px rgb(90 125 255 / .18); }
  button {
    width: 100%; margin-top: 12px; padding: 13px; font-size: 15px; font-weight: 600;
    border: 0; border-radius: 12px; background: #4a6cf7; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .55; }
  button.secondary { background: #2a2c33; color: #e7e5e1; }
  button.danger { background: #e5484d; color: #fff; }
  .msg { min-height: 34px; margin-top: 12px; font-size: 13px; color: #e5484d; word-break: break-all; }
  .msg.ok { color: #46a758; }
  .hint { margin-top: 18px; font-size: 11.5px; color: #63625e; line-height: 1.6; text-align: center; }
  .spin {
    display: inline-block; width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid rgb(255 255 255 / .25); border-top-color: #fff; border-radius: 50%;
    animation: r .8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .hidden { display: none; }

  /* 协议分段选择 */
  .seg-wrap { display: flex; gap: 8px; align-items: stretch; }
  .seg {
    width: 104px; flex-shrink: 0; display: flex; border: 1px solid #2e3038;
    border-radius: 12px; overflow: hidden; background: #17181c;
  }
  .seg button {
    margin: 0; padding: 0; border-radius: 0; background: transparent; color: #8b8a86;
    font-size: 12.5px; font-weight: 600; flex: 1;
  }
  .seg button.on { background: #2f4070; color: #fff; }
  .seg-wrap input { flex: 1; min-width: 0; }

  /* 地址列表 */
  .addr-list { margin-top: 16px; }
  .addr-item {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: #17181c; border: 1px solid #2e3038; border-radius: 12px;
    margin-bottom: 10px; cursor: pointer; transition: border-color .2s;
  }
  .addr-item:active { border-color: #5a7dff; }
  .addr-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .addr-item .dot.lan { background: #46a758; }
  .addr-item .dot.wan { background: #5a7dff; }
  .addr-item .dot.offline { background: #63625e; }
  .addr-item .info { flex: 1; min-width: 0; }
  .addr-item .name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .addr-item .url { font-size: 12px; color: #8b8a86; word-break: break-all; }
  .addr-item .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }
  .addr-item .tag.lan { background: rgb(70 167 88 / .15); color: #46a758; }
  .addr-item .tag.wan { background: rgb(90 125 255 / .15); color: #5a7dff; }
  .addr-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .addr-item .actions button {
    width: auto; margin: 0; padding: 6px 10px; font-size: 12px; border-radius: 8px;
  }
  .addr-item .actions .edit { background: #2a2c33; }
  .addr-item .actions .del { background: rgb(229 72 77 / .15); color: #e5484d; }

  /* 编辑弹层 */
  .modal-mask {
    position: fixed; inset: 0; background: rgb(0 0 0 / .6);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 24px;
  }
  .modal {
    width: 100%; max-width: 360px; background: #1b1d22; border-radius: 16px;
    padding: 20px; border: 1px solid #2e3038;
  }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .modal .row { margin-bottom: 12px; }
  .modal .row:last-child { margin-bottom: 0; }
  .modal .actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal .actions button { margin: 0; flex: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠</div>
    <h1>归祺</h1>
    <p class="sub">Sticky Kee · 智能家居画布</p>

    <div id="connecting">
      <p class="msg ok"><span class="spin"></span><span id="connectText">正在连接服务器…</span></p>
      <button class="secondary" id="btnManage">管理服务器地址</button>
    </div>

    <!-- 地址列表（有保存地址时显示） -->
    <div id="listView" class="hidden">
      <div class="addr-list" id="addrList"></div>
      <button class="secondary" id="btnAdd">+ 添加服务器地址</button>
      <p class="hint">点击地址卡片直接连接；内网、外网地址可同时保存，<br>APP 按当前网络（WiFi / 移动数据）自动选用。</p>
    </div>

    <!-- 添加/编辑表单 -->
    <div id="formView" class="hidden">
      <div class="row">
        <label for="fName">名称（如：家里内网 / 外网域名）</label>
        <input id="fName" type="text" autocomplete="off" placeholder="例如 家里内网" />
      </div>
      <div class="row">
        <label for="fUrl">服务器地址（含端口，不用填 http://）</label>
        <div class="seg-wrap">
          <div class="seg" id="fSeg">
            <button type="button" data-s="http" class="on">http://</button>
            <button type="button" data-s="https">https://</button>
          </div>
          <input id="fUrl" type="text" inputmode="url" autocapitalize="off" autocomplete="off"
                 spellcheck="false" placeholder="192.168.1.100:8080" />
        </div>
      </div>
      <div class="row">
        <label for="fType">网络类型</label>
        <select id="fType">
          <option value="lan">内网（家中 WiFi / 局域网）</option>
          <option value="wan">外网（移动数据 / 互联网）</option>
        </select>
      </div>
      <button id="btnSaveConnect">保存并连接</button>
      <button class="secondary" id="btnSave">仅保存（继续添加另一个地址）</button>
      <button class="secondary" id="btnCancel">取消</button>
      <button class="secondary" id="btnAuto">自动识别内网服务器</button>
      <p class="msg" id="msg"></p>
      <p class="hint">可分别保存内网与外网地址；协议按左侧选择自动补全，<br>手机中文输入请使用半角的冒号和斜杠。</p>
    </div>
  </div>

  <!-- 编辑弹层 -->
  <div id="modal" class="modal-mask hidden">
    <div class="modal">
      <h3 id="modalTitle">编辑地址</h3>
      <div class="row">
        <label for="mName">名称</label>
        <input id="mName" type="text" autocomplete="off" />
      </div>
      <div class="row">
        <label for="mUrl">地址（含端口，不用填 http://）</label>
        <div class="seg-wrap">
          <div class="seg" id="mSeg">
            <button type="button" data-s="http" class="on">http://</button>
            <button type="button" data-s="https">https://</button>
          </div>
          <input id="mUrl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" />
        </div>
      </div>
      <div class="row">
        <label for="mType">网络类型</label>
        <select id="mType">
          <option value="lan">内网（局域网）</option>
          <option value="wan">外网（互联网）</option>
        </select>
      </div>
      <div class="actions">
        <button class="secondary" id="mCancel">取消</button>
        <button id="mSave">保存</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var KEY = 'sn_server_config';
  var LEGACY_KEY = 'sn_server_url';

  var $connecting = document.getElementById('connecting');
  var $listView = document.getElementById('listView');
  var $formView = document.getElementById('formView');
  var $addrList = document.getElementById('addrList');
  var $msg = document.getElementById('msg');
  var $modal = document.getElementById('modal');

  // ---- 数据 ----
  function loadConfig() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    // 迁移旧数据
    try {
      var legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        var cfg = {
          addresses: [{ id: 'default', name: '默认服务器', url: legacy, type: 'lan' }],
          activeId: 'default',
          lastConnectedId: 'default'
        };
        localStorage.setItem(KEY, JSON.stringify(cfg));
        return cfg;
      }
    } catch (e) {}
    return { addresses: [], activeId: null, lastConnectedId: null };
  }

  function saveConfig(cfg) {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  function genId() { return 'srv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

  // ---- URL 归一化 ----
  // 手机中文输入法常见：全角标点（：／）、误加空格。先全角转半角并清除空白，
  // 已带协议的保留原协议（同时回传供联动选择器），否则补用户选定的协议。
  function cleanInput(s) {
    s = String(s || '');
    s = s.replace(/[\uFF01-\uFF5E]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
    s = s.replace(/\u3000/g, ' ');
    return s.replace(/\s+/g, '');
  }

  function buildURL(raw, scheme) {
    var s = cleanInput(raw).replace(/\/+$/, '');
    var m = s.match(/^(https?):\/\/(.+)$/i);
    if (m) {
      var sc = m[1].toLowerCase();
      return { url: sc + '://' + m[2].replace(/^\/+/, '').replace(/\/+$/, ''), scheme: sc };
    }
    return { url: scheme + '://' + s.replace(/^\/+/, ''), scheme: scheme };
  }

  function validHTTPURL(u) {
    try {
      var x = new URL(u);
      if (x.protocol !== 'http:' && x.protocol !== 'https:') return null;
      if (!x.host) return null;
      return x;
    } catch (e) { return null; }
  }

  // ---- 探测 ----
  // fetch 对非法 URL 会【同步抛错】（不是 rejected promise），executor 必须 try/catch，
  // 否则 probe 返回 rejected promise，调用方若无 catch 则表现为「点保存无反应」。
  function probe(u) {
    return new Promise(function (resolve) {
      var done = false;
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      function finish(ok) {
        if (!done) { done = true; clearTimeout(timer); resolve(ok); }
      }
      var timer = setTimeout(function () {
        finish(false);
        if (ctrl) { try { ctrl.abort(); } catch (e) {} }
      }, 3500);
      try {
        fetch(u + '/healthz', { mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
          .then(function () { finish(true); })
          .catch(function () { finish(false); });
      } catch (e) { finish(false); }
    });
  }

  // ---- 网络类型感知 ----
  function getNetworkType() {
    var c = navigator.connection || {};
    var t = c.type || '';
    if (t === 'wifi' || t === 'ethernet') return 'lan';
    if (t === 'cellular') return 'wan';
    return 'unknown';
  }

  // ---- 智能选择最佳地址 ----
  async function resolveBestAddress(cfg) {
    if (!cfg.addresses.length) return null;
    var netType = getNetworkType();
    var isWifi = netType === 'lan';

    // 按网络类型排序：WiFi 时 LAN 优先，蜂窝时 WAN 优先
    var sorted = cfg.addresses.slice().sort(function (a, b) {
      if (a.type === b.type) return 0;
      if (isWifi) return a.type === 'lan' ? -1 : 1;
      return a.type === 'wan' ? -1 : 1;
    });

    // 先探测 activeId
    var active = sorted.find(function (a) { return a.id === cfg.activeId; });
    if (active) {
      var ok0 = await probe(active.url);
      if (cancelled()) return null;
      if (ok0) return active;
    }

    // 并行探测前 5 个
    var batch = sorted.slice(0, 5);
    var results = await Promise.all(batch.map(function (a) {
      return probe(a.url).then(function (ok) { return { addr: a, ok: ok }; });
    }));
    var best = results.find(function (r) { return r.ok; });
    return best ? best.addr : null;
  }

  // ---- 跳转 ----
  function go(url) {
    location.replace(url + '/');
  }

  // ---- boot 取消（用户点「管理地址」） ----
  var bootCancelled = false;
  function cancelled() { return bootCancelled; }

  // ---- 视图切换 ----
  function showConnecting(text) {
    document.getElementById('connectText').textContent = text || '正在连接服务器…';
    $connecting.classList.remove('hidden');
    $listView.classList.add('hidden');
    $formView.classList.add('hidden');
  }

  function showList() {
    $connecting.classList.add('hidden');
    $listView.classList.remove('hidden');
    $formView.classList.add('hidden');
    renderList();
  }

  // ---- 协议选择器（通用绑定） ----
  function bindSeg(segId, inputId) {
    var seg = document.getElementById(segId);
    var input = document.getElementById(inputId);
    function setScheme(s) {
      seg.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('on', b.dataset.s === s);
      });
    }
    function getScheme() {
      var on = seg.querySelector('button.on');
      return on ? on.dataset.s : 'http';
    }
    // 粘贴/输入完整 URL（含协议）时自动联动选择器
    function syncFromInput() {
      var s = cleanInput(input.value);
      var m = s.match(/^(https?):\/\//i);
      if (m) setScheme(m[1].toLowerCase());
    }
    seg.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { setScheme(b.dataset.s); input.focus(); });
    });
    input.addEventListener('input', syncFromInput);
    return { setScheme: setScheme, getScheme: getScheme, syncFromInput: syncFromInput };
  }

  var fSegCtl = bindSeg('fSeg', 'fUrl');
  var mSegCtl = bindSeg('mSeg', 'mUrl');

  function showForm(editAddr) {
    $connecting.classList.add('hidden');
    $listView.classList.add('hidden');
    $formView.classList.remove('hidden');
    $msg.textContent = '';
    $msg.className = 'msg';
    document.getElementById('fName').value = editAddr ? editAddr.name : '';
    document.getElementById('fUrl').value = editAddr ? editAddr.url.replace(/^https?:\/\//i, '') : '';
    document.getElementById('fType').value = editAddr ? editAddr.type : 'lan';
    var scheme = editAddr && /^https:\/\//i.test(editAddr.url) ? 'https' : 'http';
    fSegCtl.setScheme(scheme);
    document.getElementById('btnSaveConnect').dataset.editId = editAddr ? editAddr.id : '';
  }

  // ---- 渲染地址列表 ----
  function renderList() {
    var cfg = loadConfig();
    $addrList.innerHTML = '';
    cfg.addresses.forEach(function (a) {
      var div = document.createElement('div');
      div.className = 'addr-item';
      div.innerHTML =
        '<span class="dot ' + a.type + '"></span>' +
        '<div class="info">' +
          '<div class="name">' + escapeHtml(a.name) + '</div>' +
          '<div class="url">' + escapeHtml(a.url) + '</div>' +
        '</div>' +
        '<span class="tag ' + a.type + '">' + (a.type === 'lan' ? '内网' : '外网') + '</span>' +
        '<div class="actions">' +
          '<button class="edit" data-id="' + a.id + '">编辑</button>' +
          '<button class="del" data-id="' + a.id + '">删除</button>' +
        '</div>';
      div.querySelector('.edit').addEventListener('click', function (e) {
        e.stopPropagation();
        openEditModal(a);
      });
      div.querySelector('.del').addEventListener('click', function (e) {
        e.stopPropagation();
        if (confirm('删除「' + a.name + '」？')) {
          deleteAddr(a.id);
        }
      });
      div.addEventListener('click', function () {
        connectTo(a);
      });
      $addrList.appendChild(div);
    });
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---- 编辑弹层 ----
  var editingId = null;
  function openEditModal(addr) {
    editingId = addr.id;
    document.getElementById('mName').value = addr.name;
    document.getElementById('mUrl').value = addr.url.replace(/^https?:\/\//i, '');
    document.getElementById('mType').value = addr.type;
    mSegCtl.setScheme(/^https:\/\//i.test(addr.url) ? 'https' : 'http');
    $modal.classList.remove('hidden');
  }

  document.getElementById('mCancel').addEventListener('click', function () {
    $modal.classList.add('hidden');
    editingId = null;
  });

  document.getElementById('mSave').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    try {
      var name = document.getElementById('mName').value.trim();
      var built = buildURL(document.getElementById('mUrl').value, mSegCtl.getScheme());
      var type = document.getElementById('mType').value;
      if (!name) { alert('请填写名称'); return; }
      if (!validHTTPURL(built.url)) {
        alert('地址格式不正确，请检查（冒号、斜杠用半角，需含端口）');
        return;
      }
      var cfg = loadConfig();
      var idx = cfg.addresses.findIndex(function (a) { return a.id === editingId; });
      if (idx >= 0) {
        cfg.addresses[idx] = { id: editingId, name: name, url: built.url, type: type };
        saveConfig(cfg);
      }
      $modal.classList.add('hidden');
      editingId = null;
      renderList();
    } catch (e) {
      alert('保存失败：' + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
    }
  });

  // ---- 删除地址 ----
  function deleteAddr(id) {
    var cfg = loadConfig();
    cfg.addresses = cfg.addresses.filter(function (a) { return a.id !== id; });
    if (cfg.activeId === id) cfg.activeId = cfg.addresses[0] ? cfg.addresses[0].id : null;
    if (cfg.lastConnectedId === id) cfg.lastConnectedId = null;
    saveConfig(cfg);
    if (cfg.addresses.length === 0) {
      showForm(null);
    } else {
      renderList();
    }
  }

  // ---- 连接到指定地址 ----
  async function connectTo(addr) {
    showConnecting('正在连接「' + addr.name + '」…');
    var ok = await probe(addr.url);
    if (ok) {
      var cfg = loadConfig();
      cfg.activeId = addr.id;
      cfg.lastConnectedId = addr.id;
      saveConfig(cfg);
      go(addr.url);
    } else {
      showList();
      alert('无法连接到 ' + addr.name + '（' + addr.url + '）');
    }
  }

  // ---- 添加/编辑表单：收集并写入（connect=true 时探测后跳转） ----
  function collectForm() {
    var name = document.getElementById('fName').value.trim();
    var built = buildURL(document.getElementById('fUrl').value, fSegCtl.getScheme());
    var type = document.getElementById('fType').value;
    var editId = document.getElementById('btnSaveConnect').dataset.editId;
    if (!name) return { error: '请填写名称' };
    if (!built.url || !validHTTPURL(built.url)) {
      return { error: '地址格式不正确，请检查（冒号、斜杠用半角，需含地址与端口）' };
    }
    var cfg = loadConfig();
    var addr;
    if (editId) {
      var idx = cfg.addresses.findIndex(function (a) { return a.id === editId; });
      if (idx >= 0) {
        addr = { id: editId, name: name, url: built.url, type: type };
        cfg.addresses[idx] = addr;
      }
    }
    if (!addr) {
      addr = { id: genId(), name: name, url: built.url, type: type };
      cfg.addresses.push(addr);
    }
    cfg.activeId = addr.id;
    cfg.lastConnectedId = addr.id;
    saveConfig(cfg);
    return { addr: addr };
  }

  function showMsg(text, ok) {
    $msg.textContent = text;
    $msg.className = 'msg' + (ok ? ' ok' : '');
  }

  document.getElementById('btnSaveConnect').addEventListener('click', async function () {
    var btn = this;
    btn.disabled = true;
    try {
      var r = collectForm();
      if (r.error) { showMsg(r.error); return; }
      showMsg('正在探测服务器…');
      var ok = await probe(r.addr.url);
      if (!ok) { showMsg('无法连接到 ' + r.addr.url + '，请检查地址、端口与当前网络'); return; }
      showMsg('连接成功，正在进入…', true);
      setTimeout(function () { go(r.addr.url); }, 350);
    } catch (e) {
      showMsg('保存失败：' + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('btnSave').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    try {
      var r = collectForm();
      if (r.error) { showMsg(r.error); return; }
      var hasOtherType = loadConfig().addresses.some(function (a) {
        return a.id !== r.addr.id && a.type !== r.addr.type;
      });
      showList();
      if (!hasOtherType) {
        setTimeout(function () {
          alert('已保存。建议继续添加' + (r.addr.type === 'lan' ? '外网' : '内网') + '地址，出门在外也能使用。');
        }, 100);
      }
    } catch (e) {
      showMsg('保存失败：' + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('btnCancel').addEventListener('click', function () {
    var cfg = loadConfig();
    if (cfg.addresses.length) showList();
    else showForm(null);
  });

  document.getElementById('btnAdd').addEventListener('click', function () {
    showForm(null);
  });

  // 启动期间点管理：取消自动连接，进入列表
  document.getElementById('btnManage').addEventListener('click', function () {
    bootCancelled = true;
    showList();
  });

  // ---- 自动识别 ----
  document.getElementById('btnAuto').addEventListener('click', async function () {
    var btn = this;
    btn.disabled = true;
    showMsg('正在识别内网服务器…');

    // APK 壳页为本地 origin，无法从本机 IP 推断子网；抽样探测常见网段与端口
    var prefixes = ['192.168.1', '192.168.0', '192.168.1', '10.0.0', '172.16.0'];
    var ports = [8080, 8123, 80];
    var candidates = [];
    prefixes.forEach(function (p) {
      for (var i = 1; i <= 254; i += 25) { // 抽样探测
        ports.forEach(function (port) {
          candidates.push('http://' + p + '.' + i + ':' + port);
        });
      }
    });

    // 限制并发，避免卡顿
    var found = null;
    for (var i = 0; i < candidates.length && !found; i += 5) {
      var batch = candidates.slice(i, i + 5);
      var results = await Promise.all(batch.map(function (u) {
        return probe(u).then(function (ok) { return ok ? u : null; });
      }));
      found = results.find(function (u) { return u; });
    }

    btn.disabled = false;
    if (found) {
      document.getElementById('fUrl').value = found.replace(/^https?:\/\//i, '');
      fSegCtl.setScheme('http');
      showMsg('发现服务器：' + found + '，请填写名称后保存', true);
    } else {
      showMsg('未识别到内网服务器，请手动填写地址');
    }
  });

  // ---- 启动逻辑 ----
  async function boot() {
    showConnecting();
    var cfg = loadConfig();
    if (cancelled()) return;

    // 无地址：显示添加表单
    if (!cfg.addresses.length) {
      showForm(null);
      return;
    }

    // 单地址：直接探测并跳转（期间可点「管理地址」）
    if (cfg.addresses.length === 1) {
      var a = cfg.addresses[0];
      var ok = await probe(a.url);
      if (cancelled()) return;
      if (ok) {
        cfg.activeId = a.id;
        cfg.lastConnectedId = a.id;
        saveConfig(cfg);
        go(a.url);
      } else {
        showList();
      }
      return;
    }

    // 多地址：智能选择
    var best = await resolveBestAddress(cfg);
    if (cancelled()) return;
    if (best) {
      cfg.activeId = best.id;
      cfg.lastConnectedId = best.id;
      saveConfig(cfg);
      go(best.url);
    } else {
      showList();
    }
  }

  boot();
})();
</script>
</body>
</html>
